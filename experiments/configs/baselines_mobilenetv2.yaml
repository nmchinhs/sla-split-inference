# Baselines on one device (PLAN.md Phase 2 step 8): local, offload and offload_jpeg at five
# static bandwidths, three repeats. Run on the host with the testbed up and the machine idle:
#
#   conda run --no-capture-output -n edgeinf python scripts/run_experiment.py experiments/configs/baselines_mobilenetv2.yaml
#
# Writes results/baselines_mobilenetv2/<trace>_r<repeat>.csv and .json, about 30 minutes.
# How a run is built from these numbers: the docstring of scripts/run_experiment.py.
seed: 0
model: mobilenetv2
checkpoint: checkpoints/train_mobilenetv2.pt   # must be one the edge serves (scripts/gen_compose.py)
frames: data/frames        # written by scripts/export_frames.py
split: test                # results are reported on the test split only
devices: [device-1]
variants: [local, offload, offload_jpeg]
jpeg_quality: 50           # lowest quality that costs < 0.5 points on val (experiments/jpeg/)
rate_hz: 5                 # requests per second; local inference loads the device about half (95 ms x 5 = 48%)
traces: [static_1mbps, static_5mbps, static_10mbps, static_20mbps, static_50mbps]
repeats: 3
rounds: 4                  # per run, every variant serves this many blocks, in rotating order
block_requests: 25         # logged requests of a block: rounds x block_requests = 100 per variant and run
block_warmup: 5            # requests at the start of every block that are served but not logged
warmup_requests: 50        # served before the first block of a run, spread over the variants, not logged
rpc_timeout_s: 5.0         # an Infer call that takes longer is given up and finished on the device
