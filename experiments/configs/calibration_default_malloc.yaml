# CPU-quota calibration: the chosen setting with glibc malloc left at its defaults, to show what
# the pinned thresholds in the other calibration configs change. Run on the host:
#
#   conda run -n edgeinf python scripts/calibrate_cpu.py experiments/configs/calibration_default_malloc.yaml
seed: 0
image: edgeinf-device
cpu: 8
memory: 512m
repeats: 3
requests: 20
warmup: 3
gap_ms: [20, 220]
models:
  mobilenetv2: [20, 5]
settings:       # [quota_us, period_us]
  - [100000, 100000]   # no throttling
  - [1000, 4900]
