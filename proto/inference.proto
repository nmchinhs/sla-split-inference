syntax = "proto3";

package edgeinf;

// Edge inference service. The device runs blocks [0, k) and sends the output of block k-1;
// the edge runs blocks [k, n) and returns the final prediction.
service Inference {
  rpc Infer(InferRequest) returns (InferReply);
  rpc Health(HealthRequest) returns (HealthReply);
}

message Meta {
  string device_id = 1;
  uint64 request_id = 2;
  string model = 3;  // e.g. "mobilenetv2", "resnet18"
}

message InferRequest {
  bytes tensor = 1;  // encoded by common/serialize.py (carries shape and dtype)
  uint32 k = 2;      // split point: the edge starts at block k
  Meta meta = 3;
}

message InferReply {
  int32 label = 1;          // predicted class index
  float confidence = 2;     // max softmax of the final output
  uint32 queue_len = 3;     // other requests at the edge when this one arrived
  float edge_ms = 4;        // time spent at the edge for this request, in ms
  uint64 tensor_bytes = 5;  // size of the received tensor field, in bytes
}

message HealthRequest {}

message HealthReply {
  bool ok = 1;
  uint32 queue_len = 2;  // requests currently at the edge
}
